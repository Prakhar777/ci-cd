name: React CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      # 3. Check Node.js and npm versions
      - name: Check Node.js version
        run: |
          node -v
          npm -v

      # 4. Install dependencies
      - name: Install dependencies
        run: npm ci

      # 5. Run ESLint
      - name: Run lint
        run: npm run lint

      # 6. Run tests
      - name: Run tests
        run: npm test

      # 7. Build React application
      - name: Build application
        run: npm run build

      # 8. Upload production build as artifact
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: react-build
          path: dist/

  deploy:
    runs-on: ubuntu-latest

    # Deploy only after build succeeds
    needs: build

    # GitHub Environment
    # This must match the environment in the IAM trust policy
    environment: staging

    steps:
      # 9. Configure AWS credentials using GitHub OIDC
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::597787441762:role/S3StagingDeployment
          aws-region: ap-south-1
          role-session-name: GitHubActionsStagingDeploy

      # 10. Verify AWS authentication
      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      # 11. Download React build artifact
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: react-build

      # 12. Inspect downloaded artifact
      - name: Inspect downloaded artifact
        run: |
          echo "Files downloaded:"
          ls -la

          echo "Contents:"
          find . -maxdepth 3 -type f

      # 13. Deploy React application to S3
      - name: Deploy to S3
        run: |
          aws s3 sync . s3://artifacts-597787441762-ap-south-1-an --delete